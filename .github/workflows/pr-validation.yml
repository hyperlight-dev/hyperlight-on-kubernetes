name: PR Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Consistent image tag for CI
  IMAGE_TAG: ci-${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: device-plugin/go.sum

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: just fmt-check

      - name: Run linters
        run: just lint-strict

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: device-plugin/go.sum

      - name: Build device plugin
        run: just plugin-build

  readiness:
    name: Device Readiness (${{ matrix.hypervisor }}, ${{ matrix.cpu_vendor }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - hypervisor: kvm
            cpu_vendor: hosted
            live_test: TestKVMLiveVMCreation
            live_env: TEST_KVM_LIVE
          - hypervisor: mshv
            cpu_vendor: amd
            live_test: TestMSHVLivePartitionCreation
            live_env: TEST_MSHV_LIVE
          - hypervisor: mshv
            cpu_vendor: intel
            live_test: TestMSHVLivePartitionCreation
            live_env: TEST_MSHV_LIVE
    runs-on: ${{ matrix.hypervisor == 'kvm' && 'ubuntu-24.04' || fromJSON(format('["self-hosted", "Linux", "X64", "1ES.Pool=hld-azlinux3-mshv-{0}", "JobId=device-readiness-{0}-{1}-{2}-{3}"]', matrix.cpu_vendor, github.run_id, github.run_number, github.run_attempt)) }}
    env:
      HYPERVISOR: ${{ matrix.hypervisor }}
      LIVE_TEST: ${{ matrix.live_test }}
      LIVE_ENV: ${{ matrix.live_env }}
    defaults:
      run:
        shell: bash
        working-directory: device-plugin
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: device-plugin/go.mod
          cache-dependency-path: device-plugin/go.sum

      - name: Check hypervisor host
        run: |
          uname -a
          lscpu
          git rev-parse HEAD
          stat -c '%n %F %a %U:%G %t:%T' "/dev/$HYPERVISOR"
          sudo -n test -c "/dev/$HYPERVISOR"

      - name: Test device readiness and recovery
        run: go test -race -count=1 -timeout=90s ./...

      - name: Test live hypervisor readiness
        run: |
          go test -race -c -o "$RUNNER_TEMP/device-readiness.test" .
          # Only the live probe needs root; leave host device permissions unchanged.
          sudo -n env "$LIVE_ENV=1" "$RUNNER_TEMP/device-readiness.test" \
            -test.v -test.count=1 -test.timeout=60s -test.run "^${LIVE_TEST}$" \
            | tee "$RUNNER_TEMP/live-readiness.log"
          grep -F -- "--- PASS: $LIVE_TEST (" "$RUNNER_TEMP/live-readiness.log"

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    needs: [lint, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: device-plugin/go.sum

      - name: Check KVM
        id: kvm-snapshot
        run: |
          test -c /dev/kvm
          stat -c '%a:%u:%g:%t:%T' /dev/kvm > "$RUNNER_TEMP/kvm-before-kind"
          ls -la /dev/kvm

      - name: Install just
        uses: extractions/setup-just@v2

      - name: Install kind
        run: |
          go install sigs.k8s.io/kind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install kubectl
        uses: azure/setup-kubectl@v4

      - name: Create KIND cluster
        run: |
          just local-up
          echo "✓ KIND cluster created"

      - name: Verify KIND KVM metadata transition
        shell: bash
        run: |
          node=$(kind get nodes --name hyperlight)
          kind_gid=$(docker exec "$node" getent group kvm | cut -d: -f3)
          [[ "$kind_gid" =~ ^[0-9]+$ ]]
          test -c /dev/kvm
          stat -c '%a:%u:%g:%t:%T' /dev/kvm > "$RUNNER_TEMP/kvm-after-kind"
          # KIND's systemd may assign its own kvm group to the bind-mounted device.
          IFS=: read -r mode uid _ major minor < "$RUNNER_TEMP/kvm-before-kind"
          printf '%s:%s:%s:%s:%s\n' "$mode" "$uid" "$kind_gid" "$major" "$minor" > "$RUNNER_TEMP/kvm-expected-kind"
          if ! cmp -s "$RUNNER_TEMP/kvm-before-kind" "$RUNNER_TEMP/kvm-after-kind"; then
            diff -u "$RUNNER_TEMP/kvm-expected-kind" "$RUNNER_TEMP/kvm-after-kind"
          fi
          cp "$RUNNER_TEMP/kvm-after-kind" "$RUNNER_TEMP/kvm-before-plugin"

      - name: Build device plugin
        run: |
          just plugin-build
          echo "✓ Device plugin built"

      - name: Push device plugin to local registry
        run: |
          just plugin-local-push
          echo "✓ Device plugin pushed to local registry"

      - name: Deploy device plugin
        run: |
          just plugin-local-deploy
          echo "✓ Device plugin deployed"

      - name: Wait for device plugin to be ready
        run: |
          kubectl rollout status daemonset/hyperlight-device-access -n hyperlight-system --timeout=120s
          echo "Waiting for device plugin DaemonSet..."
          kubectl rollout status daemonset/hyperlight-device-plugin -n hyperlight-system --timeout=120s
          
          # Wait for node resources to be advertised
          echo "Waiting for node resources..."
          for i in {1..30}; do
            capacity=$(kubectl get nodes -o jsonpath='{.items[0].status.allocatable.hyperlight\.dev/hypervisor}' 2>/dev/null || echo "0")
            if [ "$capacity" != "0" ] && [ -n "$capacity" ]; then
              echo "✓ Node advertising $capacity hyperlight.dev/hypervisor devices"
              break
            fi
            echo "Waiting for device plugin to register resources... ($i/30)"
            sleep 2
          done

      - name: Run device plugin tests
        run: |
          kubectl exec -n hyperlight-system daemonset/hyperlight-device-plugin -- hyperlight-device-plugin --probe-hypervisor=kvm --probe-path=/dev/kvm
          ./scripts/test.sh plugin
          ./scripts/test.sh nodes
          ./scripts/test.sh kvm
          echo "✓ Device plugin tests passed"

      - name: Build Hyperlight app
        run: |
          just app-build
          echo "✓ Hyperlight app built"

      - name: Push Hyperlight app to local registry
        run: |
          just app-local-push
          echo "✓ Hyperlight app pushed to local registry"

      - name: Deploy Hyperlight app
        run: |
          just app-local-deploy
          echo "✓ Hyperlight app deployed"

      - name: Wait for Hyperlight app to be ready
        run: |
          echo "Waiting for Hyperlight app deployment..."
          kubectl rollout status deployment/hyperlight-hello-kvm --timeout=180s

      - name: Validate Hyperlight app output
        run: |
          ./scripts/test.sh app
          echo "✓ Hyperlight app tests passed"

      - name: Show status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -A
          echo ""
          echo "=== Device Plugin Logs ==="
          kubectl logs -n hyperlight-system -l app.kubernetes.io/name=hyperlight-device-plugin --tail=50 || true
          echo ""
          echo "=== Hyperlight App Logs ==="
          kubectl logs -l app=hyperlight-hello --tail=50 || true

      - name: Cleanup
        if: always()
        run: |
          just local-down || true

      - name: Verify host KVM metadata after cleanup
        if: always() && steps.kvm-snapshot.outcome == 'success'
        run: |
          baseline="$RUNNER_TEMP/kvm-before-kind"
          if [ -f "$RUNNER_TEMP/kvm-before-plugin" ]; then
            baseline="$RUNNER_TEMP/kvm-before-plugin"
          fi
          test -c /dev/kvm
          stat -c '%a:%u:%g:%t:%T' /dev/kvm > "$RUNNER_TEMP/kvm-after"
          diff -u "$baseline" "$RUNNER_TEMP/kvm-after"
