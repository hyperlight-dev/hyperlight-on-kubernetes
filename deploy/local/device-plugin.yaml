# KIND-specific device plugin manifest
#
# NOTE: This manifest differs from deploy/manifests/device-plugin.yaml:
# - Sets terminationMessagePath to /tmp/termination-log
#
# Why? KIND runs the kubelet inside a Docker container. When we mount host
# /dev to the pod's /dev directory, kubelet cannot create /dev/termination-log
# inside the container (the default path), causing startup to fail.
#
# Setting terminationMessagePath to /tmp avoids the conflict.
#
# This is a KIND-specific workaround. Cloud providers like AKS run kubelet
# directly on the host, so they don't have this issue.
#
# For production deployments (AKS, etc.), use deploy/manifests/device-plugin.yaml

---
# Namespace for Hyperlight components
apiVersion: v1
kind: Namespace
metadata:
  name: hyperlight-system
  labels:
    app.kubernetes.io/name: hyperlight-system
    app.kubernetes.io/part-of: hyperlight

---
# ServiceAccount for device plugin
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hyperlight-device-plugin
  namespace: hyperlight-system
  labels:
    app.kubernetes.io/name: hyperlight-device-plugin
    app.kubernetes.io/part-of: hyperlight

---
# DaemonSet for Hyperlight Device Plugin
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hyperlight-device-plugin
  namespace: hyperlight-system
  labels:
    app.kubernetes.io/name: hyperlight-device-plugin
    app.kubernetes.io/part-of: hyperlight
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperlight-device-plugin
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperlight-device-plugin
        app.kubernetes.io/part-of: hyperlight
    spec:
      serviceAccountName: hyperlight-device-plugin
      # Only run on nodes with hyperlight enabled
      nodeSelector:
        hyperlight.dev/enabled: "true"
      priorityClassName: system-node-critical
      containers:
        - name: device-plugin
          # Image is substituted at deploy time via envsubst
          # Set IMAGE env var or use: just plugin-local-deploy / just plugin-azure-deploy
          image: ${IMAGE}
          imagePullPolicy: Always
          # KIND workaround: move termination log out of /dev
          terminationMessagePath: /tmp/termination-log
          env:
            - name: HOST_DEVICE_DIR
              value: /host-dev
            # Number of concurrent hypervisor allocations per node.
            # This is NOT physical devices - the hypervisor device is shared.
            # Each allocation grants access to /dev/kvm or /dev/mshv.
            # Default: 2000 (conservative for MSHV, KVM can handle more)
            - name: DEVICE_COUNT
              value: "${DEVICE_COUNT}"
            # UID/GID for device node inside containers (should match pod's runAsUser)
            - name: DEVICE_UID
              value: "${DEVICE_UID}"
            - name: DEVICE_GID
              value: "${DEVICE_GID}"
          securityContext:
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 0  # Required: write access to /var/run/cdi and /var/lib/kubelet/device-plugins
          volumeMounts:
            - name: host-dev
              mountPath: /host-dev
              readOnly: true
            # Kubelet device plugin socket directory
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            # CDI spec directory
            - name: cdi
              mountPath: /var/run/cdi
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
              hyperlight.dev/device-access: "1"
            limits:
              memory: "64Mi"
              cpu: "100m"
              hyperlight.dev/device-access: "1"
          livenessProbe:
            exec:
              command:
                - hyperlight-device-plugin
                - --health-check=liveness
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - hyperlight-device-plugin
                - --health-check=readiness
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: host-dev
          hostPath:
            path: /dev
            type: Directory
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: cdi
          hostPath:
            path: /var/run/cdi
            type: DirectoryOrCreate
      terminationGracePeriodSeconds: 30

---
# Inventory only: kubelet grants the main plugin access to this one device.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: hyperlight-device-access
  namespace: hyperlight-system
  labels:
    app.kubernetes.io/name: hyperlight-device-access
    app.kubernetes.io/part-of: hyperlight
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: hyperlight-device-access
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: hyperlight-device-access
        app.kubernetes.io/part-of: hyperlight
    spec:
      serviceAccountName: hyperlight-device-plugin
      nodeSelector:
        hyperlight.dev/enabled: "true"
      priorityClassName: system-node-critical
      containers:
        - name: device-access
          image: ${IMAGE}
          imagePullPolicy: Always
          args: ["--device-access"]
          terminationMessagePath: /tmp/termination-log
          securityContext:
            capabilities:
              drop: [ALL]
            privileged: false
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            runAsUser: 0
          volumeMounts:
            - name: device-plugin
              mountPath: /var/lib/kubelet/device-plugins
            - name: dev
              mountPath: /dev
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "32Mi"
              cpu: "100m"
          livenessProbe:
            exec:
              command: ["hyperlight-device-plugin", "--device-access", "--health-check=liveness"]
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["hyperlight-device-plugin", "--device-access", "--health-check=readiness"]
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: device-plugin
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: dev
          hostPath:
            path: /dev
            type: Directory
      terminationGracePeriodSeconds: 30
